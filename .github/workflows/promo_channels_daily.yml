name: Daily Channel Promotion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, do not publish"
        required: false
        default: true
        type: boolean

  schedule:
    # 16:30 UTC = 19:30 MSK
    - cron: "30 16 * * *"

permissions:
  contents: read

concurrency:
  group: daily-channel-promotion
  cancel-in-progress: false

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install "Telethon>=1.44,<2"

      - name: Promote channels
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}

          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

        run: |
          python -u promo_channels.py
