name: Medication Channels Daily Rotation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate preview without publishing"
        required: false
        default: true
        type: boolean

  schedule:
    # 09:40 UTC = 12:40 Moscow
    - cron: "40 9 * * *"

permissions:
  contents: read

concurrency:
  group: medication-channels-daily-rotation
  cancel-in-progress: false

jobs:
  publish:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Generate daily post
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-20b"

          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

        run: |
          python -u med_rotation_ai.py
