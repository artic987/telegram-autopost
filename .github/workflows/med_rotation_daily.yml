name: Medication Channels Every Two Days

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview all 8 posts without publishing"
        required: false
        default: true
        type: boolean

  # Запускаем проверку ежедневно.
  # Скрипт сам публикует только через день.
  schedule:
    - cron: "40 9 * * *"

permissions:
  contents: read

concurrency:
  group: medication-channels-two-day-cycle
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Generate and publish
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-20b"

          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

        run: |
          python -u med_rotation_ai.py
