name: One-time encrypted secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build env file without logging secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          keys = ["TG_API_ID","TG_API_HASH","TG_STRING_SESSION","GROQ_API_KEY"]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              raise SystemExit("Missing secrets: " + ", ".join(missing))
          body = "\n".join(f"{k}={os.environ[k]}" for k in keys) + "\n"
          Path("/tmp/telegram-autopost.env").write_text(body, encoding="utf-8")
          PY

      - name: Encrypt for VPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age -r age1ufn9x4j3pafq0yyteyav58x9rzwws89wan5tp0eem4eexzd8535srluxuk             -o /tmp/telegram-autopost.env.age /tmp/telegram-autopost.env
          rm -f /tmp/telegram-autopost.env

      - name: Upload encrypted bundle
        uses: actions/upload-artifact@v4
        with:
          name: telegram-autopost-env-age
          path: /tmp/telegram-autopost.env.age
          retention-days: 1
