name: Channel Privacy Setup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-privacy-setup
  cancel-in-progress: false

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: |
          python -m pip install "Telethon>=1.44,<2"

      - name: Configure channel privacy
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}

        run: |
          python -u channel_privacy.py
