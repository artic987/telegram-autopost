name: Telegram Personal Helper

on:
  workflow_dispatch:
  push:
    paths:
      - personal.py
      - tests/test_personal.py
      - .github/workflows/personal.yml
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

# Same Telegram authorization: never run alongside the advertising workflow.
concurrency:
  group: telegram-autopost
  cancel-in-progress: false

jobs:
  personal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test personal helper
        run: python -m unittest discover -s tests -v
      - name: Process personal messages and birthdays
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
        run: python -u personal.py
