name: Backfill Bronholitin and Zoloft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-bronholitin-zoloft
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: |
          python -m pip install "Telethon>=1.44,<2"

      - name: Fill empty channels
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-20b"

        run: |
          python -u backfill_bronholitin_zoloft.py
