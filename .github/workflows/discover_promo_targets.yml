name: Discover Promo Targets

on:
  workflow_dispatch:

  schedule:
    # Каждый день около 11:20 МСК.
    - cron: "20 8 * * *"

permissions:
  contents: write

concurrency:
  group: promo-target-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: |
          python -m pip install "Telethon>=1.44,<2"

      - name: Discover targets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}

        run: |
          python -u discover_promo_targets.py

      - name: Save new targets
        run: |
          if git diff --quiet -- promo_targets.json
          then
            echo "Новых площадок нет."
            exit 0
          fi

          git config \
            user.name \
            "telegram-promo-bot"

          git config \
            user.email \
            "telegram-promo-bot@users.noreply.github.com"

          git add \
            promo_targets.json

          git commit \
            -m "Discover new Telegram promo targets"

          git pull \
            --rebase \
            origin main

          git push \
            origin HEAD:main
