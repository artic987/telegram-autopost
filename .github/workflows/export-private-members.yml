name: Export PROFARM members

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-autopost
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telethon
        run: python -m pip install telethon
      - name: Export group participants
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
        run: python export_private_members.py
      - name: Save export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profarm-members
          path: members_export/
          retention-days: 1
          if-no-files-found: warn
