name: Join DNR prerequisite

on:
  push:
    paths:
      - ".github/workflows/join_dnr_prerequisite.yml"

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Join required channel only
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
        run: |
          python - <<'PY'
          import asyncio, os
          from telethon import TelegramClient, errors, functions
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(StringSession(os.environ['TG_STRING_SESSION']), int(os.environ['TG_API_ID']), os.environ['TG_API_HASH'])
              await client.connect()
              try:
                  entity = await client.get_entity('@DNR_objavlenija')
                  try:
                      await client(functions.channels.JoinChannelRequest(entity))
                      print('ВСТУПИЛ/УЖЕ СОСТОИМ: @DNR_objavlenija')
                  except errors.UserAlreadyParticipantError:
                      print('УЖЕ СОСТОИМ: @DNR_objavlenija')
              finally:
                  await client.disconnect()
          asyncio.run(main())
          PY
