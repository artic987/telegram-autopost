name: Telegram Autopost

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect forum routing
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          RUN_CADENCE: "daily"
          RUN_MODE: "inspect"
          TARGET_ENTITIES: "@poputchiki_24,@poputchiki_edemvmeste"
        run: python -u main.py
