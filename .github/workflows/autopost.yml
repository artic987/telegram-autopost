name: Telegram Autopost

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7 9 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Post to Telegram groups
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          DELAY_MIN_SECONDS: "45"
          DELAY_MAX_SECONDS: "75"
          RUN_CADENCE: "daily"
        run: python main.py
