name: Telegram Autopost

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Join new Telegram groups
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          RUN_CADENCE: "daily"
          RUN_MODE: "join"
          TARGET_ENTITIES: "@moskvapitertaxi1,@sariq_taxi,@mirzayevshoh,@taxipitermoskow_obsujdeniye,@taksimoskvapiter,@ekbmoc_taxi,@taksiuzb471"
        run: python -u main.py
