name: Telegram Autopost

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect Telethon API
        run: |
          python - <<'PY'
          import telethon
          from telethon import functions
          print('Telethon', telethon.__version__)
          print('channels forum symbols:', [x for x in dir(functions.channels) if 'Forum' in x or 'Topic' in x])
          print('messages forum symbols:', [x for x in dir(functions.messages) if 'Forum' in x or 'Topic' in x])
          PY
